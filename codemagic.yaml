workflows:
  android-build-test:
    name: Android Build & Test
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.alifba.alifba"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Run unit tests
        script: |
          cd $CM_BUILD_DIR
          ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**
    publishing:
      email:
        recipients:
          - rimshadpcs@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release (Play Store production)
    max_build_duration: 60
    environment:
      # Matches the reference name given when uploading the release keystore under
      # Codemagic → alifba app → Code signing identities → Android keystores. Codemagic
      # injects CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD from
      # it automatically — app/build.gradle.kts's signingConfigs.release reads exactly those
      # (falling back to a local, gitignored keystore.properties for local dev builds).
      android_signing:
        - alifba_release_keystore
      groups:
        - android_release
      vars:
        PACKAGE_NAME: "com.alifba.alifba"
      java: 17
    # Releases go straight to production, so only a version tag starts one (git tag v3.0 &&
    # git push origin v3.0); pushes to main just run android-build-test above
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Set versionCode from Google Play
        script: |
          # Play rejects a re-used versionCode, so use the latest published one + 1.
          # app/build.gradle.kts reads NEW_VERSION_CODE and falls back to its checked-in value
          # (so this is harmless before the very first upload, or if Play can't be reached).
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null | tail -1)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          echo "Latest versionCode on Google Play: $LATEST"
          echo "NEW_VERSION_CODE=$((LATEST + 1))" >> "$CM_ENV"
      - name: Build signed release bundle
        script: |
          cd $CM_BUILD_DIR
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - rimshadpcs@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        # Set as an app-level (not personal-account-global) encrypted environment variable in
        # Codemagic → alifba app → Environment variables, containing the full contents of
        # alifba-app-bdf7756740c7.json pasted in as a "Secret" variable named exactly this.
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Sent for Google's review and released to everyone once approved; "What's new" comes
        # from release_notes.json in the repo root
        track: production
